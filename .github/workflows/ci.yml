name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: lint (schema + proto + analyze.py)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tooling
        run: |
          sudo apt-get update -y
          sudo apt-get install -y sqlite3 protobuf-compiler

      - name: Validate SQLite schema syntax
        run: |
          set -euo pipefail
          sqlite3 :memory: < schema/capture.sql
          # also confirm it's idempotent (CREATE IF NOT EXISTS round-trip)
          sqlite3 :memory: < schema/capture.sql

      - name: Validate Postgres migration syntax (parse only)
        # We don't run psql here — that needs a live server. Use pg_query via
        # a one-line python check; available without extra installs.
        run: |
          python3 -c "
          import re, sys, pathlib
          src = pathlib.Path('supabase/migrations/0001_capture_items.sql').read_text()
          # cheap structural check: must contain the table + RLS enable + 2 policies
          for needle in [
              'create table if not exists public.capture_items',
              'enable row level security',
              'capture_items_select_own',
              'capture_items_insert_own',
          ]:
              assert re.search(needle, src, re.I), f'missing: {needle}'
          print('postgres migration: structural check OK')
          "

      - name: Validate proto syntax
        run: |
          set -euo pipefail
          protoc --proto_path=proto proto/capture.proto --descriptor_set_out=/dev/null
          echo "proto: OK"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run analyze.py against synthetic fixture (strict)
        run: |
          python spike/analyze.py --strict tests/fixtures/synthetic.jsonl

  android:
    name: android (placeholder until session 2)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: No-op gradle build
        # The android/ directory is empty in session 1. Once SPIKE-01 day 2
        # lands, swap this for actions/setup-java + gradle/gradle-build-action
        # and run `./gradlew assembleDebug` against android/quiet-spike.
        # Detection: presence of android/quiet-spike/build.gradle.kts means
        # the project has been scaffolded and the real build should run.
        run: |
          if [ -f android/quiet-spike/build.gradle.kts ]; then
            echo "android project scaffolded — wire the real gradle build now."
            exit 1
          fi
          echo "android/ intentionally unscaffolded in session 1 — placeholder OK"

  ios:
    name: ios (verify macos-14 runner)
    runs-on: macos-14
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install xcodegen
        run: brew install xcodegen

      - name: xcodegen --version
        run: xcodegen --version

      - name: Placeholder build step
        # Once SPIKE-01 day 1 lands, swap this for:
        #   xcodegen generate --spec ios/QuietSpike/project.yml
        #   xcodebuild -scheme QuietSpike -destination 'generic/platform=iOS' build
        # Detection: presence of ios/QuietSpike/project.yml means the project
        # has been scaffolded and the real build should run.
        run: |
          if [ -f ios/QuietSpike/project.yml ]; then
            echo "ios project scaffolded — wire the real xcodebuild now."
            exit 1
          fi
          echo "ios/ intentionally unscaffolded in session 1 — placeholder OK"
