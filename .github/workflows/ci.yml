name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: lint (schema + proto + analyze.py)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tooling
        run: |
          sudo apt-get update -y
          sudo apt-get install -y sqlite3 protobuf-compiler

      - name: Validate SQLite schema syntax
        run: |
          set -euo pipefail
          sqlite3 :memory: < schema/capture.sql
          # also confirm it's idempotent (CREATE IF NOT EXISTS round-trip)
          sqlite3 :memory: < schema/capture.sql

      - name: Validate Postgres migration syntax (parse only)
        # We don't run psql here — that needs a live server. Use pg_query via
        # a one-line python check; available without extra installs.
        run: |
          python3 -c "
          import re, sys, pathlib
          src = pathlib.Path('supabase/migrations/0001_capture_items.sql').read_text()
          # cheap structural check: must contain the table + RLS enable + 2 policies
          for needle in [
              'create table if not exists public.capture_items',
              'enable row level security',
              'capture_items_select_own',
              'capture_items_insert_own',
          ]:
              assert re.search(needle, src, re.I), f'missing: {needle}'
          print('postgres migration: structural check OK')
          "

      - name: Validate proto syntax
        run: |
          set -euo pipefail
          protoc --proto_path=proto proto/capture.proto --descriptor_set_out=/dev/null
          echo "proto: OK"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run analyze.py against synthetic fixture (strict)
        run: |
          python spike/analyze.py --strict tests/fixtures/synthetic.jsonl

  android:
    name: android (assembleDebug + verifySchemaInSync)
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: android/quiet-spike
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Synthesise .env from GitHub Actions secrets so the BuildConfig
      # values resolve. Secrets are NEVER printed (`set +x`); the file is
      # written to the repo root because app/build.gradle.kts looks there.
      # All secrets are optional — if any are missing, the corresponding
      # BuildConfig field is empty and the runtime sandbox call simply
      # logs a warning. This keeps the assembleDebug job green even when
      # Precondition B (Supabase/PowerSync) isn't yet configured.
      - name: Synthesise .env from secrets
        working-directory: ${{ github.workspace }}
        run: |
          set +x
          {
            echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}"
            echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}"
            echo "POWERSYNC_URL=${{ secrets.POWERSYNC_URL }}"
            echo "QUIET_TEST_USER_EMAIL=${{ secrets.QUIET_TEST_USER_EMAIL }}"
            echo "QUIET_TEST_USER_PASSWORD=${{ secrets.QUIET_TEST_USER_PASSWORD }}"
            echo "QUIET_TEST_USER_ID=${{ secrets.QUIET_TEST_USER_ID }}"
          } > .env

      - name: Copy schema → SQLDelight source set
        run: ./gradlew :app:copyCaptureSchema
      - name: Verify schema is in sync (no drift)
        run: ./gradlew :app:verifySchemaInSync
      - name: Assemble debug
        run: ./gradlew :app:assembleDebug
  ios:
    name: ios (xcodebuild + unsigned .ipa artifact)
    # macos-15 ships Xcode 16 by default. macos-14 only has Xcode 15.4,
    # which can't read xcodegen's modern project format (objectVersion 77)
    # — that's how CI run 25469745126 failed. Stay on 15 going forward.
    runs-on: macos-15
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios/QuietSpike
        run: |
          xcodegen generate --spec project.yml
          ls -la

      - name: Resolve Swift package dependencies (GRDB)
        working-directory: ios/QuietSpike
        run: |
          xcodebuild -resolvePackageDependencies \
            -project QuietSpike.xcodeproj \
            -scheme QuietSpike

      - name: Build (unsigned, generic iOS device)
        working-directory: ios/QuietSpike
        run: |
          set -euo pipefail
          xcodebuild \
            -project QuietSpike.xcodeproj \
            -scheme QuietSpike \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build

      - name: Package unsigned .ipa for sideloading
        # Produces an .ipa that Sideloadly can re-sign with a free Apple ID.
        # The xcarchive route would also work but pulling the .app out of
        # DerivedData is faster and avoids the export-options-plist dance.
        working-directory: ios/QuietSpike
        run: |
          set -euo pipefail
          APP_DIR=$(find build/Build/Products -name "QuietSpike.app" -type d | head -1)
          if [ -z "$APP_DIR" ]; then
            echo "QuietSpike.app not found under build/Build/Products"
            find build/Build/Products -maxdepth 3 -type d
            exit 1
          fi
          mkdir -p out/Payload
          cp -R "$APP_DIR" out/Payload/
          ( cd out && zip -qr QuietSpike-unsigned.ipa Payload )
          ls -la out/QuietSpike-unsigned.ipa

      - name: Upload unsigned .ipa
        uses: actions/upload-artifact@v4
        with:
          name: QuietSpike-unsigned-ipa
          path: ios/QuietSpike/out/QuietSpike-unsigned.ipa
          retention-days: 14
