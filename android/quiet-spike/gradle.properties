# android/quiet-spike/gradle.properties
# Centralised project-wide Gradle config. Don't put secrets here — those
# come from .env (read by app/build.gradle.kts) and never get committed.

org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# AndroidX everywhere; AGP refuses to build with this off.
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official

# buildFeatures we need are set per-module in app/build.gradle.kts (compose,
# buildConfig). The legacy android.defaults.buildfeatures.* properties are
# deprecated as of AGP 8.5 — see the WARNING in CI logs of run 25468257709.
